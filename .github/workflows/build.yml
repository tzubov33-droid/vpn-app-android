name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create www directory and move files
        run: |
          mkdir -p www
          # Ищем файлы во всех папках и копируем их в www
          cp $(find . -name "index.html" | head -n 1) www/ || cp index.html www/
          cp $(find . -name "app.js" | head -n 1) www/ || cp app.js www/
          cp $(find . -name "firebase-app.js" | head -n 1) www/ || cp firebase-app.js www/
          cp $(find . -name "firebase-firestore.js" | head -n 1) www/ || cp firebase-firestore.js www/
          ls -la www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "VPN App" "com.vpn.app" --web-dir www
          npx cap add android

      - name: Sync files
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
