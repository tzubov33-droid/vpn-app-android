<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN App</title>
    <style>
        body {
            background-color: #0f1115;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .main-content {
            width: 100%;
            max-width: 600px;
            background-color: #1a1d24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #8b93a1; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin: 0;">Мой VPN</h2>
    </div>

    <div class="main-content">
        <h1>Добро пожаловать!</h1>
        <p>Регистрация отключена. Вы вошли как Гость.</p>
        <p>Здесь скоро появятся сервера, чаты и админ-панель.</p>
    </div>

    <!-- Подключаем только app.js -->
    <script type="module" src="app.js"></script>
</body>
</html>
